<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0D1117"/>
    <stop offset="0.55" stop-color="#111827"/>
    <stop offset="1" stop-color="#151A21"/>
  </linearGradient>
  <linearGradient id="accent" x1="120" y1="80" x2="1050" y2="290" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F97316"/>
    <stop offset="1" stop-color="#FACC15"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="36"/>
  </filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" stroke="#30363D" stroke-width="1" opacity=".32"/>
  </pattern>
</defs>

<rect width="1280" height="360" rx="28" fill="url(#bg)"/>
